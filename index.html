<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="영어놀이">
<title>영어 놀이터</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;overflow:hidden}
body{
 --bg:#0e1220;--pnl:#18203a;--pnl2:#131a30;--line:#2a3555;
 --acc:#4d7cfe;--acc2:#ff7a59;--ok:#2fbf71;--bad:#e5484d;--gold:#f5b53f;
 --txt:#f0f3fa;--sub:#8e9cbd;
 background:var(--bg);color:var(--txt);
 font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;
 display:flex;flex-direction:column;
 padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
body.kid{--bg:#fff8ec;--pnl:#ffffff;--pnl2:#fffdf6;--line:#f2e2c8;--acc:#ff9f2e;--acc2:#3bb2f6;--txt:#3b2a14;--sub:#a08a68}
button{font-family:inherit;color:inherit;border:none;background:none;cursor:pointer}
header{flex:0 0 auto;padding:10px 12px;background:var(--pnl);border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center}
.hbtn{padding:9px 12px;border-radius:11px;background:var(--pnl2);border:1px solid var(--line);font-size:13px;font-weight:800}
.htitle{flex:1;font-size:15px;font-weight:800;text-align:center}
.streak{padding:8px 11px;border-radius:11px;background:#3a2a08;color:var(--gold);font-size:12px;font-weight:800}
body.kid .streak{background:#fff0d0;color:#c47b0a}
main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px}
.pg{display:none}.pg.on{display:block}
.hero{text-align:center;padding:16px 8px 22px}
.hero .big{font-size:54px}
.hero h1{margin:8px 0 4px;font-size:22px}
.hero p{margin:0;color:var(--sub);font-size:13.5px;line-height:1.6}
.mode{width:100%;padding:20px 18px;margin-bottom:12px;border-radius:20px;background:var(--pnl);border:1px solid var(--line);text-align:left;display:flex;gap:14px;align-items:center}
.mode .ic{font-size:36px;flex:0 0 auto}
.mode .tt{font-size:18px;font-weight:800;margin-bottom:4px;display:block}
.mode .ds{font-size:12.5px;color:var(--sub);line-height:1.55;display:block}
.mode.k{border-color:#ff9f2e55;background:linear-gradient(135deg,#2a2138,#1a1f36)}
.stats{display:flex;gap:8px;margin-top:6px}
.stat{flex:1;padding:13px 8px;border-radius:14px;background:var(--pnl2);border:1px solid var(--line);text-align:center}
.stat .v{font-size:21px;font-weight:800;color:var(--acc)}
.stat .l{font-size:10.5px;color:var(--sub);font-weight:700;margin-top:3px}
.bar{height:9px;border-radius:6px;background:var(--pnl2);overflow:hidden;margin:14px 0 6px;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--ok));transition:width .4s}
.barlab{font-size:11.5px;color:var(--sub);font-weight:700;text-align:center}
.kidcats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kc{padding:22px 10px;border-radius:20px;background:var(--pnl);border:2px solid var(--line);text-align:center}
.kc .e{font-size:38px}
.kc .n{font-size:14px;font-weight:800;margin-top:6px}
#kcard{text-align:center;padding:6px 0}
#kemo{font-size:120px;line-height:1.1;margin:10px 0}
#ken{font-size:42px;font-weight:900;letter-spacing:.5px}
#kko{font-size:19px;color:var(--sub);margin-top:8px;font-weight:700}
.knav{display:flex;gap:10px;margin-top:20px}
.knav button{flex:1;padding:19px 6px;border-radius:18px;font-size:17px;font-weight:900;background:var(--pnl);border:2px solid var(--line)}
.knav .pl{background:var(--acc);color:#fff;border-color:transparent;flex:1.4}
.kquiz{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px;margin-top:14px}
.kq{padding:16px 4px;border-radius:18px;background:var(--pnl);border:2px solid var(--line);font-size:44px;text-align:center}
.kq.yes{background:#1f4d33;border-color:var(--ok)}
body.kid .kq.yes{background:#dff7e7}
.kq.no{opacity:.35}
.kqhint{text-align:center;font-size:15px;font-weight:800;color:var(--sub);margin:18px 0 4px}
#kcheer{text-align:center;font-size:34px;font-weight:900;color:var(--ok);min-height:44px;margin-top:10px}
.card{background:var(--pnl);border:1px solid var(--line);border-radius:20px;padding:20px 16px;text-align:center}
.card .emo{font-size:72px;line-height:1.1}
.card .en{font-size:34px;font-weight:900;margin-top:6px;word-break:break-word}
.card .ko{font-size:16px;color:var(--sub);margin-top:8px;font-weight:700}
.step{display:flex;gap:6px;justify-content:center;margin-bottom:12px}
.step i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.step i.on{background:var(--acc);width:22px;border-radius:4px}
.qlab{font-size:12px;font-weight:800;color:var(--acc);text-align:center;margin-bottom:10px;letter-spacing:.5px}
.opts{display:grid;gap:9px;margin-top:14px}
.opt{padding:16px 14px;border-radius:15px;background:var(--pnl);border:2px solid var(--line);font-size:17px;font-weight:700;text-align:left}
.opt.yes{background:#1c4a32;border-color:var(--ok)}
body.kid .opt.yes{background:#ddf6e6}
.opt.no{background:#4a1d20;border-color:var(--bad)}
.acts{display:flex;gap:9px;margin-top:16px}
.btn{flex:1;padding:17px 8px;border-radius:16px;background:var(--acc);color:#fff;font-size:15.5px;font-weight:800;text-align:center}
.btn.g{background:var(--pnl2);color:var(--txt);border:1px solid var(--line)}
.btn.o{background:var(--acc2)}
.inp{width:100%;padding:16px;border-radius:15px;background:var(--pnl2);color:var(--txt);border:2px solid var(--line);font-size:19px;font-weight:700;text-align:center;margin-top:14px;-webkit-user-select:text;user-select:text}
.ansbox{margin-top:14px;padding:15px;border-radius:15px;background:var(--pnl2);border:1px solid var(--line);font-size:14px;line-height:1.7}
.ansbox b{color:var(--ok);font-size:19px}
.score{text-align:center;margin-top:16px}
.score .n{font-size:52px;font-weight:900;line-height:1}
.score .m{font-size:14px;color:var(--sub);margin-top:8px;font-weight:700}
.sc{width:100%;padding:17px 15px;margin-bottom:10px;border-radius:17px;background:var(--pnl);border:1px solid var(--line);text-align:left;display:flex;gap:13px;align-items:center}
.sc .ic{font-size:30px}
.sc .tt{font-size:16px;font-weight:800;display:block}
.sc .ds{font-size:12px;color:var(--sub);margin-top:3px}
.chat{padding-bottom:6px}
.msg{max-width:88%;padding:13px 15px;border-radius:17px;margin-bottom:11px;background:var(--pnl);border:1px solid var(--line)}
.msg.me{margin-left:auto;background:var(--acc);color:#fff;border-color:transparent}
.msg .en{font-size:17px;font-weight:700;line-height:1.4}
.msg .ko{font-size:12.5px;opacity:.72;margin-top:5px}
.picks{margin-top:6px}
.pick{width:100%;padding:15px 14px;margin-bottom:9px;border-radius:15px;background:var(--pnl2);border:2px solid var(--acc);text-align:left}
.pick .en{font-size:16.5px;font-weight:800}
.pick .ko{font-size:12px;color:var(--sub);margin-top:4px}
.hintline{text-align:center;font-size:12.5px;color:var(--sub);margin:10px 0;line-height:1.6}
#rec{position:fixed;inset:0;z-index:90;background:var(--bg);display:none;flex-direction:column;padding:calc(env(safe-area-inset-top) + 24px) 20px calc(env(safe-area-inset-bottom) + 20px)}
#rec.on{display:flex}
.rh{display:flex;gap:9px;align-items:center;justify-content:center;flex:0 0 auto}
.dot{width:12px;height:12px;border-radius:50%;background:var(--bad);animation:bl .85s infinite}
@keyframes bl{50%{opacity:.15;transform:scale(.7)}}
.rl{font-size:15px;font-weight:800;color:var(--bad)}
.target{flex:0 0 auto;margin-top:26px;text-align:center;font-size:30px;font-weight:900;line-height:1.35}
.tko{text-align:center;font-size:13.5px;color:var(--sub);margin-top:10px}
#rtx{flex:1;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:800;text-align:center;color:var(--acc);padding:18px 4px;line-height:1.4;overflow-y:auto}
#rtx.idle{color:var(--sub);font-size:16px;font-weight:600}
#rdone{flex:0 0 auto;padding:20px;border-radius:18px;background:var(--bad);color:#fff;font-size:18px;font-weight:900}
.wave{display:flex;gap:5px;justify-content:center;align-items:flex-end;height:26px;margin-top:14px;flex:0 0 auto}
.wave i{width:5px;background:var(--acc);border-radius:3px;animation:wv .9s infinite}
.wave i:nth-child(1){height:12px;animation-delay:0s}
.wave i:nth-child(2){height:22px;animation-delay:.12s}
.wave i:nth-child(3){height:26px;animation-delay:.24s}
.wave i:nth-child(4){height:18px;animation-delay:.36s}
.wave i:nth-child(5){height:24px;animation-delay:.48s}
@keyframes wv{0%,100%{transform:scaleY(.35)}50%{transform:scaleY(1)}}
.note{font-size:11.5px;color:var(--sub);text-align:center;margin-top:12px;line-height:1.6;opacity:.85}
</style>
</head>
<body>
<header>
  <button class="hbtn" id="back">← 홈</button>
  <div class="htitle" id="title">영어 놀이터</div>
  <div class="streak" id="streak">🔥 0일</div>
</header>
<main>
  <div class="pg on" id="p-home">
    <div class="hero">
      <div class="big">🎈</div>
      <h1>영어 놀이터</h1>
      <p>그림과 소리로 시작해서<br>말하기까지 — 인터넷 없어도 돼요</p>
    </div>
    <button class="mode k" id="m-kid">
      <span class="ic">🧸</span>
      <span><span class="tt">유아 모드</span><span class="ds">큰 그림 + 소리로 놀며 배우기<br>글자 몰라도 OK</span></span>
    </button>
    <button class="mode" id="m-study">
      <span class="ic">📘</span>
      <span><span class="tt">학습 모드</span><span class="ds">새 단어 → 듣기 → 말하기 → 작문<br>틀린 건 다음날 자동 복습</span></span>
    </button>
    <button class="mode" id="m-talk">
      <span class="ic">🗣</span>
      <span><span class="tt">대화 연습</span><span class="ds">카페·자기소개·길 묻기 등<br>실제 상황 롤플레이</span></span>
    </button>
    <div class="bar"><i id="pbar" style="width:0%"></i></div>
    <div class="barlab" id="plab">오늘 목표</div>
    <div class="stats">
      <div class="stat"><div class="v" id="s1">0</div><div class="l">배운 단어</div></div>
      <div class="stat"><div class="v" id="s2">0</div><div class="l">복습 대기</div></div>
      <div class="stat"><div class="v" id="s3">0</div><div class="l">완전 암기</div></div>
    </div>
    <div class="note" id="swnote">✈️ 유아모드·듣기·작문·복습은 오프라인 작동<br>🎤 말하기 채점은 인터넷 필요</div>
  </div>
  <div class="pg" id="p-kidcat">
    <div class="hintline">무엇을 배울까요?</div>
    <div class="kidcats" id="kidcats"></div>
    <button class="btn o" id="kgame" style="margin-top:14px">🎯 소리 듣고 찾기 놀이</button>
  </div>
  <div class="pg" id="p-kidcard">
    <div id="kcard">
      <div id="kemo">🐶</div>
      <div id="ken">dog</div>
      <div id="kko">강아지</div>
    </div>
    <div class="knav">
      <button id="kprev">◀</button>
      <button class="pl" id="kplay">🔊 다시 듣기</button>
      <button id="knext">▶</button>
    </div>
    <div class="note" id="kidx"></div>
  </div>
  <div class="pg" id="p-kidgame">
    <div class="kqhint">🔊 소리를 듣고 찾아보세요</div>
    <button class="btn" id="kqplay">🔊 다시 듣기</button>
    <div class="kquiz" id="kquiz"></div>
    <div id="kcheer"></div>
  </div>
  <div class="pg" id="p-study">
    <div class="step" id="step"></div>
    <div class="qlab" id="qlab"></div>
    <div id="sbody"></div>
  </div>
  <div class="pg" id="p-talklist">
    <div class="hintline">상황을 골라주세요<br>상대가 영어로 말을 걸어요</div>
    <div id="sclist"></div>
  </div>
  <div class="pg" id="p-talk">
    <div class="chat" id="chat"></div>
    <div class="picks" id="picks"></div>
  </div>
</main>
<div id="rec">
  <div class="rh"><span class="dot"></span><span class="rl">듣고 있어요…</span></div>
  <div class="wave"><i></i><i></i><i></i><i></i><i></i></div>
  <div class="target" id="rtarget"></div>
  <div class="tko" id="rko"></div>
  <div id="rtx" class="idle">이 문장을 소리내어 말해보세요</div>
  <button id="rdone">⏹ 다 말했어요</button>
</div>

function today(){return new Date().toISOString().slice(0,10)}
function addDays(n){const d=new Date();d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)}
const GAP=[1,1,3,7,14,30];
function prog(){return DB.get('prog',{})}
function setProg(p){DB.set('prog',p)}
function bump(){const c=DB.get('count',{});c[today()]=(c[today()]||0)+1;DB.set('count',c)}
function mark(word,ok){const p=prog(),it=p[word]||{box:0,seen:0,wrong:0};
 it.seen++;if(ok)it.box=Math.min(5,it.box+1);else{it.box=0;it.wrong++}
 it.due=addDays(GAP[it.box]);p[word]=it;setProg(p);bump();streakUp()}
function dueWords(){const p=prog(),t=today();return W.filter(w=>p[w[0]]&&p[w[0]].due<=t)}
function newWords(){const p=prog();return W.filter(w=>!p[w[0]])}
function streakUp(){const last=DB.get('last',''),s=DB.get('streak',0),t=today();
 if(last===t)return;DB.set('streak',last===addDays(-1)?s+1:1);DB.set('last',t)}
function refreshHome(){const p=prog(),learned=Object.keys(p).length;
 const mastered=Object.values(p).filter(x=>x.box>=4).length;
 $('s1').textContent=learned;$('s2').textContent=dueWords().length;$('s3').textContent=mastered;
 $('streak').textContent='🔥 '+DB.get('streak',0)+'일';
 const c=DB.get('count',{})[today()]||0,goal=15;
 $('pbar').style.width=Math.min(100,c/goal*100)+'%';
 $('plab').textContent=c>=goal?'🎉 오늘 목표 달성! ('+c+'개)':'오늘 '+c+' / '+goal+'개 학습'}

const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
function sim(a,b){const n=s=>s.toLowerCase().replace(/[^a-z0-9 ]/g,'').replace(/\s+/g,' ').trim();
 a=n(a);b=n(b);if(!a||!b)return 0;if(a===b)return 100;
 const la=a.length,lb=b.length,d=[];
 for(let i=0;i<=la;i++)d[i]=[i];
 for(let j=0;j<=lb;j++)d[0][j]=j;
 for(let i=1;i<=la;i++)for(let j=1;j<=lb;j++)
  d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));
 return Math.max(0,Math.round((1-d[la][lb]/Math.max(la,lb))*100))}
function listen(target,ko,cb){
 if(!SR){alert('이 브라우저는 음성인식을 지원하지 않아요');return}
 unlock();if(window.speechSynthesis)speechSynthesis.cancel();
 const rc=new SR();rc.lang='en-US';rc.interimResults=true;rc.continuous=false;
 let fin='',best='',done=false,tmr=null,auto=null;
 $('rtarget').textContent=target;$('rko').textContent=ko||'';
 $('rtx').className='idle';$('rtx').textContent='이 문장을 소리내어 말해보세요';
 $('rec').classList.add('on');
 function stop(){try{rc.stop()}catch(e){}clearTimeout(tmr);tmr=setTimeout(finish,1100)}
 function finish(){if(done)return;done=true;clearTimeout(tmr);clearTimeout(auto);
  $('rec').classList.remove('on');
  const said=(fin.trim()||best.trim());cb(said?sim(said,target):0)}
 $('rdone').onclick=stop;
 rc.onstart=()=>{auto=setTimeout(stop,10000)};
 rc.onresult=e=>{let im='';
  for(let i=e.resultIndex;i<e.results.length;i++){const t=e.results[i][0].transcript;
   if(e.results[i].isFinal)fin+=t;else im+=t}
  const all=(fin+im).trim();
  if(all){best=fin+im;$('rtx').className='';$('rtx').textContent=all}};
 rc.onerror=e=>{if(e.error==='not-allowed'){done=true;$('rec').classList.remove('on');
   alert('마이크 권한을 허용해 주세요\n(설정 > Safari > 마이크)')}
  else if(e.error==='network'){done=true;$('rec').classList.remove('on');
   alert('말하기 채점은 인터넷이 필요해요')}};
 rc.onend=finish;
 try{rc.start()}catch(e){$('rec').classList.remove('on')}}

 w.innerHTML='<div class="card"><div class="en" style="font-size:22px">'+p[0]+'</div>'+
 '<div class="ko" style="margin-top:8px">'+p[1]+'</div></div>'+
 '<div class="acts">'+(on?'<button class="btn o" id="c1">🎤 말해보기</button>':'')+
 '<button class="btn g" id="c2">'+(on?'말 안 하고 넘기기':'다음 →')+'</button></div>'+

 say(p[0],.8);
 if(on)$('c1').onclick=()=>listen(p[0],p[1],v=>{
  $('cres').innerHTML='<div class="score"><div class="n" style="color:'+(v>=70?'var(--ok)':v>=40?'var(--gold)':'var(--bad)')+'">'+v+'점</div>'+

  '<div class="acts"><button class="btn g" id="cr">🔁 다시 말하기</button><button class="btn" id="cn">계속 →</button></div>';
  $('cr').onclick=()=>choose(p);$('cn').onclick=()=>send(p)});
 $('c2').onclick=()=>send(p)}

 m.querySelector('.en').textContent=p[0];m.querySelector('.ko').textContent=p[1];
